<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Neon Glow Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.35" />

  <!-- Central Shield Mark (Trust & Security) -->
  <path d="M 256 120 
           C 335 120, 390 140, 390 185 
           C 390 295, 320 370, 256 405 
           C 192 370, 122 295, 122 185 
           C 122 140, 177 120, 256 120 Z" 
        fill="#1E293B" 
        stroke="url(#cyanGrad)" 
        stroke-width="9" 
        filter="url(#subtleShadow)" />

  <!-- Stylized Fast Forward / Growth Wings -->
  <path d="M 205 195 L 265 245 L 205 295 Z" fill="url(#greenGrad)" opacity="0.85" filter="url(#glow)" />
  <path d="M 260 195 L 320 245 L 260 295 Z" fill="url(#greenGrad)" />

  <!-- Rupee Symbol (₹) in Front of Shield -->
  <!-- Top Horizontal Bar -->
  <rect x="200" y="180" width="105" height="15" rx="7.5" fill="url(#goldGrad)" />
  <!-- Middle Horizontal Bar -->
  <rect x="200" y="210" width="92" height="15" rx="7.5" fill="url(#goldGrad)" />
  <!-- Stem & Curve -->
  <path d="M 242 180 
           L 242 258 
           C 295 258, 300 215, 242 215 
           M 236 252 
           L 292 330" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Verified Trust Badge (Green Checkmark) -->
  <circle cx="365" cy="340" r="28" fill="#10B981" filter="url(#glow)" />
  <path d="M 353 340 L 362 349 L 379 331" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
